<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage | BoilerFoods</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html"><img src="logo.png" alt="BoilerFoods Logo" style="height: 50px;"></a>
                <button id="theme-toggle">Dark/Light Mode</button>
            </div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="create_post.html">Review</a>
            <a href="login_signup.html">Login/Sign Up</a>
        </nav>
    </header>

    <main>
        <section class="create-post">
            <h2>Write a Review</h2>
            <form id="reviewForm" class="review-form">
                <div class="form-group">
                    <label for="title">Title:</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="form-group">
                    <label for="description">Description:</label>
                    <textarea id="description" name="description" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label for="upload">Upload Image:</label>
                    <input type="file" id="upload" name="upload">
                </div>
                <div class="form-actions">
                    <button type="submit" class="submit-btn">Submit</button>
                    <button type="reset" class="reset-btn">Reset</button>
                </div>
            </form>
        </section>

        <!-- FAQ Section -->
        <section class="faq-section">
            <h2>Frequently Asked Questions</h2>
            <div id="faq-container">
                <!-- FAQs will be loaded here -->

                <button id="back-to-top" style="display: none;">↑</button>   <!-- Back-to-top button-->
            </div> 
        </section>
    </main>

    <footer>
        <p>© 2024 BoilerFoods. All rights reserved.</p>
    </footer>

    <script src="faq.js"></script>
    <script>
        document.getElementById('reviewForm').addEventListener('submit', function(event) {
            event.preventDefault();
            
            const title = document.getElementById('title').value;
            const description = document.getElementById('description').value;
            const reviews = JSON.parse(localStorage.getItem('reviews')) || [];
            
            reviews.push({title: title, description: description});
            localStorage.setItem('reviews', JSON.stringify(reviews));
            
            alert('Review received: ' + title);
            
            // Optionally clear the form
            this.reset();
        });
    </script>
    <script src="toggle.js"></script>
    <script src="backtop.js"></script>
</body>
</html>
