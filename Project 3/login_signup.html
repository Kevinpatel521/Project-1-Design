<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage | BoilerFoods</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html"><img src="logo.png" alt="BoilerFoods Logo" style="height: 50px;"></a>
                <button id="theme-toggle">Dark/Light Mode</button>

            </div>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="create_post.html">Review</a>
            <a href="login_signup.html">Login/Sign Up</a>
        </nav>
    </header>

    <main>
        <section class="login-section">
            <h2>Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Username:</label>
                    <input type="text" id="login-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Password:</label>
                    <input type="password" id="login-password" name="password" required>
                </div>
                <button type="button" onclick="login()">Login</button>
            </form>
        </section>

        <section class="signup-section">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-username">Username:</label>
                    <input type="text" id="signup-username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email:</label>
                    <input type="email" id="signup-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password:</label>
                    <input type="password" id="signup-password" name="password" required>
                </div>
                <button type="button" onclick="signUp()">Sign Up</button>
                <button id="back-to-top" style="display: none;">↑</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2024 BoilerFoods. All rights reserved.</p>
    </footer>
    <script src="authentication.js"></script>
    <script src="toggle.js"></script>
    <script src="backtop.js"></script>
</body>
</html>
